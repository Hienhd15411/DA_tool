name: vnq-fetch-test
# Kích hoạt khi touch .github/vnq-fetch-test (MCP không có workflow_dispatch).
on:
  push:
    paths:
      - '.github/vnq-fetch-test'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pandas pyarrow yfinance requests
      - name: Probe Yahoo Finance (.VN)
        run: python tools/yf_probe.py
      - name: Probe Yahoo VN-Index
        if: always()
        run: python tools/yf_index_probe.py
      - name: Cross-check nguồn VN
        if: always()
        run: python tools/cross_check.py
      - name: Kéo lịch sử giá thô Yahoo 2022→nay
        if: always()
        run: python tools/yf_raw_history.py
      - name: Probe VCI (endpoint vnstock)
        if: always()
        run: python tools/vci_probe.py
      - name: Kéo VCI cập nhật đến hôm nay (không upload)
        if: always()
        run: python tools/vci_update.py
      - name: Kéo VCI toàn bộ lịch sử từ 2022 (artifact)
        if: always()
        run: python tools/vci_full.py
      - name: Verify VNDirect vs panel/Yahoo
        if: always()
        run: python tools/verify_vnd.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yf-probe-${{ github.run_id }}
          path: |
            tools/out/probe/
            tools/out/crosscheck/
            tools/out/verify_vnd/
            tools/out/vci/
            tools/out/vci_update/
            tools/out/vci_full/
            tools/out/raw/
          retention-days: 14
