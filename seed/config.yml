# Seed config cho dataset chứng khoán VN (vnstock → Supabase).
#
# Range đã mở rộng để match spec ML (docs/ml_trend_5d_spec.md):
#   - Warmup : trước 2025-01-01, cần ≥252 phiên → start 2023-10-01
#   - Train  : 2025-01-01 → 2026-06-30
#   - Test   : 2026-07-01 → hôm nay (2026-10-26)

seed: 42

dates:
  start:  "2023-10-01"
  end:    "2026-10-26"

tickers:
  exchange: "HSX"            # HOSE / HSX
  limit:   null              # null = lấy hết; set số để test nhanh (VD 20)
  skip:    []                # mã bỏ qua (VD mã đã huỷ niêm yết)
  # vndirect listing API bị block từ GitHub Actions (chặn geo) → dùng list hardcoded
  # bên dưới. Bổ sung thêm mã nếu cần.
