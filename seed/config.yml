# Indices benchmark cho spec ML (VN-Index bắt buộc)
indices:
  - { code: "VNINDEX",     name: "VN-Index",       source: "VCI" }
  - { code: "VN30",        name: "VN30",           source: "VCI" }
  - { code: "HNXINDEX",    name: "HNX-Index",      source: "VCI" }

vnstock:
  source:          "VCI"      # VCI | TCBS | DNSE | MSN
  interval:        "1D"       # daily
  throttle_sec:    0.5        # sleep giữa request (bump 0.3→0.5 vì range dài hơn)
  max_retries:     5          # bump 3→5 cho robustness

fundamentals:
  period: "quarter"           # quarter | year
  lang:   "en"
  # Fetch từ 2023Q1 để có TTM cho đầu 2024 (4 quý trailing)
  min_year: 2023

