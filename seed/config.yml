# Seed config cho dataset chứng khoán VN (vnstock → Supabase).

seed: 42

dates:
  start:  "2024-01-01"
  end:    "2025-12-31"

tickers:
  exchange: "HSX"            # HOSE / HSX (vnstock dùng 'HSX')
  limit:   null              # null = lấy hết; set số để test nhanh (VD 20)
  skip:    []                # mã bỏ qua (VD mã đã huỷ niêm yết)

vnstock:
  source:          "VCI"      # VCI | TCBS | DNSE | MSN
  interval:        "1D"       # daily
  throttle_sec:    0.3        # sleep giữa request để tránh rate limit
  max_retries:     3

fundamentals:
  period: "quarter"           # quarter | year
  lang:   "en"                # en | vi

holidays:
  # Nghỉ lễ VN 2024-2025 (bỏ market closed → is_trading_day = false)
  2024:
    - { date: "2024-01-01", name: "Tết Dương lịch" }
    - { date: "2024-02-08", name: "Tết Nguyên đán" }
    - { date: "2024-02-09", name: "Tết Nguyên đán" }
    - { date: "2024-02-12", name: "Tết Nguyên đán" }
    - { date: "2024-02-13", name: "Tết Nguyên đán" }
    - { date: "2024-02-14", name: "Tết Nguyên đán" }
    - { date: "2024-04-18", name: "Giỗ Tổ Hùng Vương" }
    - { date: "2024-04-29", name: "Nghỉ bù 30/4" }
    - { date: "2024-04-30", name: "Giải phóng miền Nam" }
    - { date: "2024-05-01", name: "Quốc tế Lao động" }
    - { date: "2024-09-02", name: "Quốc khánh" }
    - { date: "2024-09-03", name: "Nghỉ bù Quốc khánh" }
  2025:
    - { date: "2025-01-01", name: "Tết Dương lịch" }
    - { date: "2025-01-27", name: "Nghỉ bù Tết Âm" }
    - { date: "2025-01-28", name: "Tết Nguyên đán" }
    - { date: "2025-01-29", name: "Tết Nguyên đán" }
    - { date: "2025-01-30", name: "Tết Nguyên đán" }
    - { date: "2025-01-31", name: "Tết Nguyên đán" }
    - { date: "2025-04-07", name: "Giỗ Tổ Hùng Vương (nghỉ bù)" }
    - { date: "2025-04-30", name: "Giải phóng miền Nam" }
    - { date: "2025-05-01", name: "Quốc tế Lao động" }
    - { date: "2025-05-02", name: "Nghỉ bù 30/4-1/5" }
    - { date: "2025-09-02", name: "Quốc khánh" }

